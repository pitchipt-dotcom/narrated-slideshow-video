<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>画像ライブラリ評価</title>
    <link rel="stylesheet" href="/image-library-admin.css">
    <link rel="stylesheet" href="/navigation.css">
    <script src="/image-library-admin.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <nav class="admin-nav" aria-label="主要画面">
          <a href="/">動画を作る</a>
          <a href="/image-library-admin" aria-current="page">画像ライブラリ</a>
        </nav>
        <h1>画像ライブラリ評価</h1>
        <p>画像は削除せず、採用・保留・除外を管理します。</p>
      </header>
      <section class="upload-card" aria-labelledby="upload-title">
        <h2 id="upload-title">画像を追加</h2>
        <form id="upload-form">
          <label id="drop-zone" class="drop-zone">
            <strong>画像を選択</strong>
            <span>またはPCからここへドラッグ＆ドロップ</span>
            <input id="upload-images" name="images" type="file" accept=".png,.jpg,.jpeg,.webp,.heic,.heif,image/png,image/jpeg,image/webp,image/heic,image/heif" multiple required>
          </label>
          <p id="selected-files">選択されていません。最大10枚、1枚20MB、合計100MB。</p>
          <label>共通メモ
            <textarea id="upload-note" name="note" maxlength="2000"></textarea>
          </label>
          <label>共通タグ（カンマ区切り）
            <input id="upload-tags" name="tags" placeholder="歩行, リハビリ">
          </label>
          <label class="rights-check">
            <input id="rights-confirmed" name="rights_confirmed" type="checkbox" value="true" required>
            この画像を登録・動画利用できる権利があることを確認しました
          </label>
          <button class="upload-button" type="submit">選択画像を保留で登録</button>
          <p id="upload-result" class="upload-result" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="filters" aria-label="絞り込み">
        <label>状態
          <select id="status-filter">
            <option value="all">すべて</option>
            <option value="pending">保留</option>
            <option value="approved">採用</option>
            <option value="excluded">除外</option>
          </select>
        </label>
        <label>並び順
          <select id="sort-filter">
            <option value="recent">最近更新順</option>
            <option value="usage">使用回数順</option>
            <option value="asset">asset ID順</option>
          </select>
        </label>
        <button id="reload" type="button">再読込</button>
      </section>
      <p id="summary" role="status" aria-live="polite">読み込み中…</p>
      <section id="asset-grid" class="asset-grid"></section>
    </main>
  </body>
</html>
